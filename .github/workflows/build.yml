name: Build MIME

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target MIME_VST3 MIME_Standalone --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/MIME_artefacts/Release/VST3/MIME.vst3" "dist/MIME.vst3"
          Copy-Item "build/MIME_artefacts/Release/Standalone/MIME.exe" "dist/MIME Standalone.exe"
          Copy-Item "README.md" "dist/README.md"
          Compress-Archive -Path dist/* -DestinationPath MIME-Windows.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MIME-Windows
          path: MIME-Windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MIME-Windows.zip
