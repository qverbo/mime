name: Build MIME

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target MIME_VST3 MIME_Standalone --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/MIME_artefacts/Release/VST3/MIME.vst3" "dist/MIME.vst3"
          Copy-Item "build/MIME_artefacts/Release/Standalone/MIME.exe" "dist/MIME Standalone.exe"
          Copy-Item "README.md" "dist/README.md"
          Compress-Archive -Path dist/* -DestinationPath MIME-Windows.zip
          # single-file .vst3 (the DLL inside the bundle) for drag-and-drop installs
          Copy-Item "build/MIME_artefacts/Release/VST3/MIME.vst3/Contents/x86_64-win/MIME.vst3" "MIME.vst3"

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: MIME-Windows
          path: |
            MIME-Windows.zip
            MIME.vst3

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          name: MIME ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          body: |
            Download **MIME-Windows.zip**, unzip, and copy `MIME.vst3` to `C:\Program Files\Common Files\VST3\`.
            Then rescan plugins in FL Studio. See the README for setup.
          files: |
            MIME.vst3
            MIME-Windows.zip
